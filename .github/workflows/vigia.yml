# Vigía diario: comprueba la cadena completa de Puedo Rodar (web, tiles R2,
# fuentes de riesgo, Worker, JSONs de las Actions). Si algo falla DE VERDAD, el
# workflow queda en rojo Y se abre/actualiza un issue con la etiqueta "vigia" —
# GitHub manda email al dueño del repo. Pega ese issue en una sesión de Claude
# para arreglarlo.
# "De verdad" = las fuentes con caídas transitorias documentadas (INFOEX,
# Euskalmet, REDIAM…) tienen días de gracia: un tropiezo suelto sale como ⚠️ en
# el log y el run sigue verde; solo escala si se repite N días seguidos. La
# racha vive en vigia/state.json y la commitea este workflow.
name: Vigía diario

on:
  schedule:
    # 16:30 UTC = 18:30 CEST, cuando ya han corrido todas las fuentes del día.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write # commitear vigia/state.json (la racha de fallos)
  issues: write

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar la cadena
        run: node vigia/check.mjs

      # Siempre, aunque el chequeo salga en rojo: si no se guarda la racha, un
      # fallo persistente volvería a contar como "día 1" mañana y no escalaría
      # nunca.
      - name: Guardar la racha de fallos
        if: always()
        run: |
          [ -f vigia/state.json ] || { echo "sin state.json (el chequeo ni arrancó)"; exit 0; }
          git config user.name "vigia-bot"
          git config user.email "actions@github.com"
          git add vigia/state.json
          git diff --cached --quiet && echo "sin cambios en la racha" && exit 0
          git commit -m "vigia: racha $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - name: Abrir o actualizar issue si algo falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create vigia --color D93F0B --description "Aviso del vigía diario" --force
          cuerpo=$(cat vigia-report.txt 2>/dev/null || echo "El chequeo no llegó a generar informe: mira el log del workflow.")
          existente=$(gh issue list --label vigia --state open --json number --jq '.[0].number')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$cuerpo"
          else
            gh issue create --title "🔴 Vigía: algo falla ($(date -u +%F))" --body "$cuerpo" --label vigia
          fi
